# Egress allowlist default domains.
#
# Matching convention (see EgressAllowlistHandler): an entry may be one of three
# forms.
#   - Leading dot (".github.com"): matches that domain and any subdomain.
#   - Glob pattern (contains "*", "?" or a "[...]" character class): matched
#     against the whole host with path.Match. "*" spans dots, so it matches any
#     subdomain depth. Glob values that begin with "*" or "[" MUST be quoted,
#     otherwise YAML reads them as an alias or a flow sequence.
#   - Plain entry ("storage.googleapis.com"): matches only that exact host.
# Prefer exact hosts. Use the leading-dot or glob forms only for domains whose
# matched components are entirely provider-controlled and never user-creatable,
# so that user-controlled names — e.g. object-storage buckets reachable as
# <bucket>.storage.googleapis.com — cannot be abused as an exfiltration channel.
# In particular, a glob over a shared, multi-tenant storage domain is unsafe
# whenever any matched label is attacker-choosable. This includes broad forms
# like "*.blob.core.windows.net" AND infix forms like "*vsblobprod*.blob.core.
# windows.net": an Azure storage account name is a customer-chosen lowercase
# alphanumeric string, so an attacker can register a name containing "vsblobprod".
# The same reasoning rules out globbing shared multi-tenant compute/registry
# namespaces even when a component looks "fixed": a 12-digit AWS account id
# (e.g. "<id>.dkr.ecr.*.amazonaws.com" or CodeArtifact endpoints) matches every
# AWS tenant, including an attacker's own account, so those are reached only via
# the job's own credentials (dynamic hosts), never a default glob. A path-style
# object store such as "storage.googleapis.com" exposes every bucket, so it is
# only ever allowed as an EXACT apex host (never a glob or leading-dot form) and
# only where a public ecosystem's downloads redirect there; see its accepted-risk
# note in go_modules. Virtual-hosted "<bucket>.storage.googleapis.com" subdomains
# stay blocked as a class, and are only ever added one exact, already-registered
# bucket at a time (see maven-central in maven), never as a glob or leading-dot
# form. The other glob over unreserved shared storage retained here is
# the NuGet CDN (see its entries), a known, accepted exposure documented at its
# call site, not a pattern to copy.

# github_infra_domains are the GitHub and Dependabot infrastructure domains that
# are always allowed. Their subdomains are entirely GitHub-controlled (api.,
# codeload., objects./raw.githubusercontent.com, api.<tenant>.ghe.com), so the
# leading-dot suffix form is safe here.
github_infra_domains:
  - .github.com
  - .githubusercontent.com
  - .githubapp.com
  - .ghe.com
  - ghcr.io

# shared_registry_domains are third-party registry / artifact-hosting providers
# that serve many ecosystems at once (AWS CodeArtifact, Azure Artifacts, etc.),
# plus public JVM repositories and mirrors seen across jobs. They are applied to
# every job like the ecosystem defaults, but are grouped here because they do not
# belong to any single ecosystem.
#
# NOTE: providers whose subdomain is a customer-chosen tenant name — e.g.
# <tenant>.jfrog.io, <org>.pkgs.visualstudio.com, <org>.cloudsmith.io,
# <feed>.myget.org — are deliberately NOT wildcarded here: a global "*.<provider>"
# wildcard would allow an attacker-provisioned tenant. When a job actually uses
# such a registry it is added exactly, per job, via the credential-derived
# dynamic hosts. The same applies to single-organization private registries
# (artifactory.*, nexus.*, etc.), which are covered by the job's own credentials.
shared_registry_domains:
  # JFrog Artifactory Online download backends: fixed, JFrog-owned S3 buckets
  # (shared regional buckets, plus dedicated-instance buckets). Listed as exact
  # hosts, not a glob, because the "jfrog-prod/-shared-/-dedicated-/-main"
  # tokens are not a reserved AWS namespace, so a glob over the multi-tenant
  # s3.amazonaws.com domain could be satisfied by an attacker-registered bucket.
  # A job's own <tenant>.jfrog.io registry is added exactly via dynamic hosts;
  # these are the storage backends those registries redirect to.
  - jfrog-prod-apne1-shared-tokyo-main.s3.amazonaws.com
  - jfrog-prod-aps1-shared-mumbai-main.s3.amazonaws.com
  - jfrog-prod-apse2-shared-sydney-main.s3.amazonaws.com
  - jfrog-prod-euc1-shared-frankfurt-main.s3.amazonaws.com
  - jfrog-prod-euw1-shared-ireland-main.s3.amazonaws.com
  - jfrog-prod-euw2-shared-london-main.s3.amazonaws.com
  - jfrog-prod-use1-shared-virginia-main.s3.amazonaws.com
  - jfrog-prod-usw2-shared-oregon-main.s3.amazonaws.com
  - jfrog-prod-use1-dedicated-virginia-main.s3.amazonaws.com
  - pkgs.dev.azure.com
  - jitpack.io
  # NOTE: AWS CodeArtifact endpoints
  # (<domain>-<account-id>.d.codeartifact.<region>.amazonaws.com) are NOT
  # allowlisted here. The account id is any 12-digit number, so a glob would
  # match every AWS tenant's CodeArtifact — including an attacker's own account.
  # A job's configured CodeArtifact repository is added exactly via dynamic hosts.
  # Public JVM (Maven/Gradle/sbt) repositories used across many jobs.
  - repo.spring.io
  - services.gradle.org
  - plugins-artifacts.gradle.org
  - repository.jboss.org
  - oss.sonatype.org
  - repository.apache.org
  - central.sonatype.com
  - clojars.org
  - repo.clojars.org
  - repo.jenkins-ci.org
  - repo.papermc.io
  - repo.codemc.io
  - repo.codemc.org
  - hub.spigotmc.org
  - repo.extendedclip.com
  - repo.helpch.at
  - maven.anypoint.mulesoft.com
  - maven.pkg.jetbrains.space
  - packages.jetbrains.team
  # Public package mirrors that serve several ecosystems.
  - mirrors.aliyun.com
  - maven.aliyun.com
  - repo.huaweicloud.com
  - mirror.nju.edu.cn
  # Private Packagist (Composer) hosting.
  - packagist.com
  - repo.packagist.com
  # Public VCS forges. Reached for git-based dependencies (go_modules direct
  # fetch, cargo git deps) and Maven SCM resolution. Apex exact entries only:
  # subdomains of these forges are user-creatable (e.g. GitLab Pages), so the
  # leading-dot form would be attacker-satisfiable.
  - bitbucket.org
  - api.bitbucket.org
  - codeberg.org
  - gitea.com
  - git.sr.ht
  - gitlab.com
  - gitlab.freedesktop.org
  - foss.heptapod.net
  # Public JVM repositories (continued).
  - s01.oss.sonatype.org
  - www.jitpack.io
  - repo.gradle.org
  - downloads.gradle.org
  - repo.typesafe.com
  - maven.twttr.com
  - build.shibboleth.net
  - maven.enginehub.org
  - maven.canvasmc.io
  - repo.thenextlvl.net
  - cdn.reproio.com
  - build-artifacts.signal.org
  - redirector.kotlinlang.org
  - developer.huawei.com
  # Maven/registry indexes served from GitHub Pages. EXACT hosts only:
  # "*.github.io" is user-creatable and must never be globbed.
  - appboy.github.io
  - juliaregistries.github.io
  # NOTE: Cloudsmith's download hosts (dl./npm.cloudsmith.io) are deliberately
  # NOT listed. They are shared multi-tenant hosts whose customer namespace and
  # repository live in the URL PATH, and the allowlist authorizes the hostname
  # only — it does not constrain path or method. An attacker with their own
  # Cloudsmith namespace could therefore encode data in a request that the
  # hostname check would permit, and Cloudsmith surfaces package-request logs to
  # repository owners. A job's own Cloudsmith repository is added exactly, per
  # job, via the credential-derived dynamic hosts instead.
  # Public mirrors (continued).
  - mirrors.cloud.tencent.com
  - mirrors.huaweicloud.com

# registry_redirect_derivations are storage hosts that a configured registry
# 302-redirects package downloads to, but that appear in no credential field.
# Unlike every other section here, these are NOT applied to every job: each is
# allowed only for a job whose own credentials name the matching registry.
#
# Use this section when the target is a single bucket or CDN shared by all of a
# provider's tenants, with the tenant in the URL path. Such a host must never go
# into the sections above, where it would expose one tenant's content to every
# job in the world (see add-egress-allowlist-domain).
#
#   credential_host: matches a job's credential host exactly, or, with a leading
#                    dot, any subdomain of that domain but not the apex.
#   derived:         exact hosts to allow for that job. Glob and leading-dot
#                    forms are rejected at startup: dynamic hosts are matched
#                    exactly so that a crafted credential cannot widen them.
#
# Every derived host is a constant. Targets whose name embeds a value taken from
# the credential (e.g. the private ECR layer bucket, which interpolates the
# region) stay in registryRedirectHosts in Go.
registry_redirect_derivations:
  # packagecloud.io redirects downloads to one CloudFront distribution it owns.
  - credential_host: packagecloud.io
    derived:
      - d3fo0g5hm7lbuv.cloudfront.net
  # Every Gemfury endpoint (pypi., npm., gem., ...) redirects downloads to
  # pre-signed URLs on one Gemfury-owned bucket, reachable on both its dualstack
  # and plain Transfer Acceleration endpoints.
  - credential_host: .fury.io
    derived:
      - gemfury.s3-accelerate.dualstack.amazonaws.com
      - gemfury.s3-accelerate.amazonaws.com

# ecosystem_default_domains lists the public registry and CDN hosts each
# Dependabot ecosystem needs. The map is kept keyed by ecosystem for provenance
# and documentation, but the handler applies the UNION of all values to every
# job (it does not partition by PACKAGE_MANAGER). Entries are exact hosts unless
# a leading dot or glob pattern is present. Shared multi-tenant object stores
# (e.g. storage.googleapis.com, which exposes every bucket via path-style URLs)
# are avoided where possible; storage.googleapis.com is listed only as an exact
# apex host because public Go and Dart downloads redirect there (see the
# accepted-risk note in go_modules), and its virtual-hosted subdomains stay
# blocked.
#
# Ecosystems that share an identical registry set are de-duplicated with a YAML
# anchor on the first member and an alias on the rest (npm_and_yarn/bun,
# pip/uv, maven/gradle, docker/docker_compose/devcontainers). Edit the anchored
# list and every alias follows automatically; do not expand an alias back into a
# literal copy. TestEgressDefaults_AliasedEcosystemsStayInSync enforces this.
#
# Every registered Dependabot ecosystem has an entry. An empty list means the
# ecosystem reaches only GitHub/Dependabot infrastructure or plain git (covered
# by github_infra_domains and the job's own git credentials), or its registries
# are configured per job: github_actions, submodules, swift, vcpkg, pre_commit
# (all git/GitHub-hosted) and helm (chart repositories supplied per job). Keys
# must match the ecosystem internal names registered in dependabot-core
# (Dependabot::FileFetchers.register).
ecosystem_default_domains:
  npm_and_yarn: &npm_registries
    - registry.npmjs.org
    - registry.yarnpkg.com
    - repo.yarnpkg.com
    - jsr.io
    - registry.bower.io
    - registry.npmjs.com
    - registry.npmmirror.com
    - cdn.npmmirror.com
    - npm.flatt.tech
    - registry.npm.ouryahoo.com
    - npm.fontawesome.com
    - cdn.sheetjs.com
    - npm.jsr.io
    - dl.fontawesome.com
    # GitHub Packages npm content host; npm.pkg.github.com 302-redirects here.
    # Exact only; listed in api.github.com/meta domains.packages.
    - npmregistryv2prod.blob.core.windows.net
    # Node.js runtime downloads. pnpm fetches these when a lockfile pins a Node
    # runtime (devEngines); unofficial-builds serves the musl and other
    # non-official platform builds. Both are exact entries, so neither opens the
    # nodejs.org namespace.
    - nodejs.org
    - unofficial-builds.nodejs.org
    # Continuous-release preview packages, published per commit/PR. Shared host
    # with the namespace in the path; unlike Cloudsmith above it exposes no
    # per-tenant request logs, so it is listed rather than credential-derived.
    - pkg.pr.new
    # Backstage's published version manifests, read by the Backstage CLI during
    # upgrades. Anonymous, no redirects.
    - versions.backstage.io
  bun: *npm_registries
  pip: &python_registries
    - pypi.org
    - pypi.python.org
    - files.pythonhosted.org
    - pythonhosted.org
    - download.pytorch.org
    - pypi.nvidia.com
    - pypi.tuna.tsinghua.edu.cn
    - download-r2.pytorch.org
    - flashinfer.ai
    # Changelog/release-note hosts, not registries. Dependabot follows the
    # project_urls it reads from PyPI metadata to render release notes in pull
    # requests; blocking these degrades PR bodies but never breaks resolution.
