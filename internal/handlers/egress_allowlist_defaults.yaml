    - registry.npmjs.org
  bazel:
    - bcr.bazel.build
    - releases.bazel.build
  julia:
    - pkg.julialang.org
    - us-east.pkg.julialang.org
    - us-west.pkg.julialang.org
    # Official Julia release/artifact storage.
    - julialang-s3.julialang.org
    # storage.julialang.net 302-redirects package tarballs to the exact
    # virtual-hosted bucket below, so both ends of the chain are required.
    #
    # The bucket is pinned exactly rather than globbed over the region: only
    # "julialang-storage-us-east-1" exists today, and sibling names such as
    # "julialang-storage-eu-west-1" are unclaimed, so a
    # "julialang-storage-*.s3.*.amazonaws.com" pattern would point at an
    # attacker-registrable bucket. If Julia adds a region, add it here.
    - storage.julialang.net
    - julialang-storage-us-east-1.s3.us-east-1.amazonaws.com
  rust_toolchain:
    - static.rust-lang.org
  conda:
    - api.anaconda.org
    - anaconda.org
    - conda.anaconda.org
    - repo.anaconda.com
  nix:
    - channels.nixos.org
  devcontainers: *docker_registries
  # helm pulls OCI charts from container registries (the docker set) and also
  # fetches from common public HTTP chart repositories. It is spelled out
  # explicitly (rather than aliasing the docker set) so the public chart repos
  # can be added. Additional private chart repos are still supplied per job via
  # credentials.
  helm:
    # OCI chart registries (mirrors the docker set above).
    - registry-1.docker.io
    - auth.docker.io
    - index.docker.io
    - registry.hub.docker.com
    - hub.docker.com
    - production.cloudflare.docker.com
    - production.cloudfront.docker.com
    - ghcr.io
    - mcr.microsoft.com
    # Leading-dot for the same reason as the docker list: Quay tenancy is
    # path-based, so its cdnNN blob hosts are provider-controlled.
    - .quay.io
    - public.ecr.aws
    - .gcr.io
    - .pkg.dev
    # Public HTTP chart repositories. The GitHub Pages hosts are exact (a
    # specific org's pages), never a "*.github.io" wildcard.
    - charts.bitnami.com
    - charts.jetstack.io
    - prometheus-community.github.io
    - grafana.github.io
    - jaegertracing.github.io
  # GitHub-hosted or per-job configured; covered by github_infra_domains / git.
  # Note: additional per-job dependencies (e.g. pre_commit hooks that install
  # from other ecosystems) are covered because the handler applies the union of
  # ALL ecosystem hosts to every job, not just the job's own package manager.
  github_actions: []
  submodules: []
  # swift builds may also resolve CocoaPods dependencies.
  swift:
    - cocoapods.org
    - download.swift.org
    # KARTE's (Plaid, Inc.) SDK host, serving the xcframework.zip binaryTargets
    # declared in the vendor's own public Package.swift. Anonymous, no redirect.
    # Exact: *.karte.io also fronts the vendor's unrelated product subdomains.
    - sdk.karte.io
    # Prelude's SDK bucket, serving the PreludeCore xcframework.zip binaryTarget
    # declared in the vendor's own public Package.swift. Anonymous, no redirect.
    # Exact virtual-hosted bucket; never the path-style s3.amazonaws.com apex.
    - prelude-public.s3.amazonaws.com
  vcpkg: []
  pre_commit: []
