    # so ".readthedocs.io" must never be used here.
    - docs.pytest.org
    - docs.sqlalchemy.org
    - alembic.sqlalchemy.org
    - anyio.readthedocs.io
    # docs.pydantic.dev 301-redirects to pydantic.dev, and psycopg.org 302s to
