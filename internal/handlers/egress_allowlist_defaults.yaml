    - redis.readthedocs.io
  uv: *python_registries
  bundler:
    - rubygems.org
    - index.rubygems.org
    - gems.rubygems.org
    - rails-assets.org
    - gem.coop
    # GitHub Packages RubyGems content host; rubygems.pkg.github.com redirects here.
